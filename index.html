<!-- PANTALLA DE EXPLORACIÓN / MAPA DE LA MAZMORRA -->
<div id="screen-map" class="screen">
    <h2 id="map-room-title">MAZMORRA - PISO 1</h2>
    <div class="pixel-box" style="text-align: center;">
        <canvas id="dungeon-canvas" width="400" height="400" style="background:#000; border:2px solid #45475a;"></canvas>
        <p style="font-size: 9px; color: #a6e3a1; margin-top: 10px;">Usa las flechas o los botones para explorar:</p>
        <div style="display: flex; justify-content: center; gap: 10px; margin-top: 5px;">
            <button id="btn-move-up" style="width:50px;">⬆️</button>
        </div>
        <div style="display: flex; justify-content: center; gap: 10px; margin-top: 5px;">
            <button id="btn-move-left" style="width:50px;">⬅️</button>
            <button id="btn-move-down" style="width:50px;">⬇️</button>
            <button id="btn-move-right" style="width:50px;">➡️</button>
        </div>
    </div>
</div>
